<svg xmlns="http://www.w3.org/2000/svg" width="980" height="800" viewBox="0 0 980 800" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The CoCo sound multiplexer, and the CoCo Zero's way</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4250"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="800" fill="#ffffff"/>

  <!-- ===================== Panel A: the real CoCo ===================== -->
  <rect x="8" y="8" width="964" height="450" rx="10" fill="#fafbfd" stroke="#c9d0db"/>
  <text x="24" y="36" font-size="16" font-weight="bold" fill="#1d2430">The real CoCo: sound_sources = switched</text>
  <text x="24" y="56" fill="#55606e">The stock CoCo 2 and CoCo 3 profiles. One source at a time reaches the TV.</text>

  <!-- sources -->
  <g fill="#ffffff" stroke="#6b7685">
    <rect x="24" y="76" width="280" height="46" rx="6"/>
    <rect x="24" y="136" width="280" height="46" rx="6"/>
    <rect x="24" y="196" width="280" height="46" rx="6"/>
    <rect x="24" y="256" width="280" height="46" rx="6"/>
  </g>
  <text x="36" y="96" font-weight="bold" fill="#1d2430">0  6-bit DAC</text>
  <text x="36" y="113" fill="#55606e">PIA1 PA2-7, $FF20</text>
  <text x="36" y="156" font-weight="bold" fill="#1d2430">1  Cassette input</text>
  <text x="36" y="173" fill="#55606e">no tape is played on the CoCo Zero</text>
  <text x="36" y="216" font-weight="bold" fill="#1d2430">2  Cartridge sound line</text>
  <text x="36" y="233" fill="#55606e">SN76489, CoCo PSG, Symphony-12 mono</text>
  <text x="36" y="276" font-weight="bold" fill="#1d2430">3  Nothing</text>
  <text x="36" y="293" fill="#55606e">silence</text>

  <!-- sound half of the multiplexer -->
  <rect x="350" y="76" width="130" height="226" rx="8" fill="#e8eefc" stroke="#4a68b0"/>
  <text x="415" y="180" text-anchor="middle" font-weight="bold" fill="#1d2f5c">Sound</text>
  <text x="415" y="197" text-anchor="middle" font-weight="bold" fill="#1d2f5c">multiplexer</text>
  <g stroke="#3a4250" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M304,99 L348,99"/>
    <path d="M304,159 L348,159"/>
    <path d="M304,219 L348,219"/>
    <path d="M304,279 L348,279"/>
  </g>

  <!-- select lines -->
  <rect x="290" y="318" width="250" height="50" rx="6" fill="#fff6e0" stroke="#b58a1e"/>
  <text x="415" y="338" text-anchor="middle" font-weight="bold" fill="#5c4308">Select lines</text>
  <text x="415" y="356" text-anchor="middle" fill="#5c4308">PIA0 CB2 ($FF03) and CA2 ($FF01)</text>
  <g stroke="#b58a1e" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M415,318 L415,304"/>
    <path d="M415,368 L415,382"/>
  </g>

  <!-- sound enable -->
  <rect x="520" y="166" width="170" height="46" rx="6" fill="#fdeedd" stroke="#c0732a"/>
  <text x="605" y="186" text-anchor="middle" font-weight="bold" fill="#5a3110">Sound enable</text>
  <text x="605" y="203" text-anchor="middle" fill="#5a3110">PIA1 CB2, $FF23 bit 3</text>
  <path d="M480,189 L518,189" stroke="#3a4250" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- summing point -->
  <circle cx="770" cy="189" r="17" fill="#ffffff" stroke="#3a4250" stroke-width="1.5"/>
  <text x="770" y="195" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2430">+</text>
  <path d="M690,189 L751,189" stroke="#3a4250" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- direct sources -->
  <rect x="700" y="76" width="260" height="46" rx="6" fill="#e6f4ea" stroke="#3f8a55"/>
  <text x="712" y="96" font-weight="bold" fill="#173d22">Not through the multiplexer</text>
  <text x="712" y="113" fill="#2c5a38" font-size="12">Orchestra-90, Symphony-12 stereo, Deluxe</text>
  <path d="M770,122 L770,170" stroke="#3a4250" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- single-bit -->
  <rect x="700" y="244" width="260" height="46" rx="6" fill="#ffffff" stroke="#6b7685"/>
  <text x="712" y="264" font-weight="bold" fill="#1d2430">Single-bit output</text>
  <text x="712" y="281" fill="#55606e">PB1, $FF22 bit 1, when an output</text>
  <path d="M770,244 L770,208" stroke="#3a4250" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- out -->
  <path d="M787,189 L872,189" stroke="#3a4250" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="880" y="185" font-weight="bold" fill="#1d2430">to the</text>
  <text x="880" y="201" font-weight="bold" fill="#1d2430">TV</text>

  <!-- joystick half -->
  <rect x="24" y="384" width="280" height="56" rx="6" fill="#ffffff" stroke="#6b7685"/>
  <text x="36" y="405" font-weight="bold" fill="#1d2430">Joystick axes</text>
  <text x="36" y="423" fill="#55606e">right X, right Y, left X, left Y</text>
  <rect x="350" y="384" width="130" height="56" rx="8" fill="#e8eefc" stroke="#4a68b0"/>
  <text x="415" y="407" text-anchor="middle" font-weight="bold" fill="#1d2f5c">Joystick</text>
  <text x="415" y="424" text-anchor="middle" font-weight="bold" fill="#1d2f5c">multiplexer</text>
  <path d="M304,412 L348,412" stroke="#3a4250" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="520" y="384" width="170" height="56" rx="6" fill="#ffffff" stroke="#6b7685"/>
  <text x="605" y="405" text-anchor="middle" font-weight="bold" fill="#1d2430">Comparator</text>
  <text x="605" y="423" text-anchor="middle" fill="#55606e">axis against the DAC</text>
  <path d="M480,412 L518,412" stroke="#3a4250" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M690,412 L722,412" stroke="#3a4250" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="728" y="408" fill="#1d2430">PIA0 PA7</text>
  <text x="728" y="424" fill="#55606e">$FF00 bit 7</text>

  <!-- select table -->
  <g font-size="12">
    <rect x="828" y="318" width="132" height="122" rx="6" fill="#ffffff" stroke="#c9d0db"/>
    <text x="838" y="336" font-weight="bold" fill="#1d2430">CB2 CA2 picks</text>
    <text x="838" y="356" fill="#1d2430">0 0  DAC, right X</text>
    <text x="838" y="376" fill="#1d2430">0 1  tape, right Y</text>
    <text x="838" y="396" fill="#1d2430">1 0  cart, left X</text>
    <text x="838" y="416" fill="#1d2430">1 1  none, left Y</text>
    <text x="838" y="432" fill="#55606e">sound and joystick</text>
  </g>

  <!-- ===================== Panel B: the CoCo Zero ===================== -->
  <rect x="8" y="474" width="964" height="318" rx="10" fill="#fafbfd" stroke="#c9d0db"/>
  <text x="24" y="502" font-size="16" font-weight="bold" fill="#1d2430">The CoCo Zero: sound_sources = all, joystick_quiet = on</text>
  <text x="24" y="522" fill="#55606e">Every source is heard at once. The select lines still pick the joystick axis, but no longer the sound.</text>

  <g fill="#ffffff" stroke="#6b7685">
    <rect x="24" y="542" width="280" height="46" rx="6"/>
    <rect x="24" y="602" width="280" height="46" rx="6"/>
    <rect x="24" y="662" width="280" height="46" rx="6"/>
    <rect x="24" y="722" width="280" height="46" rx="6"/>
  </g>
  <text x="36" y="562" font-weight="bold" fill="#1d2430">6-bit DAC</text>
  <text x="36" y="579" fill="#55606e">SOUND, PLAY, nearly every game</text>
  <text x="36" y="622" font-weight="bold" fill="#1d2430">Single-bit output</text>
  <text x="36" y="639" fill="#55606e">PB1, when an output</text>
  <text x="36" y="682" font-weight="bold" fill="#1d2430">Cartridge chips</text>
  <text x="36" y="699" fill="#55606e">SN76489, CoCo PSG, Symphony-12 mono</text>
  <text x="36" y="742" font-weight="bold" fill="#1d2430">Orchestra-90, Symphony-12 stereo</text>
  <text x="36" y="759" fill="#55606e">and the Deluxe CoCo; left and right kept</text>

  <rect x="350" y="542" width="240" height="46" rx="6" fill="#fdeedd" stroke="#c0732a"/>
  <text x="362" y="562" font-weight="bold" fill="#5a3110">joystick_quiet</text>
  <text x="362" y="579" fill="#5a3110">joystick trial values taken out</text>
  <path d="M304,565 L348,565" stroke="#3a4250" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <circle cx="700" cy="655" r="17" fill="#ffffff" stroke="#3a4250" stroke-width="1.5"/>
  <text x="700" y="661" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2430">+</text>
  <g stroke="#3a4250" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M590,565 L650,565 L687,642"/>
    <path d="M304,625 L681,651"/>
    <path d="M304,685 L681,659"/>
    <path d="M304,745 L650,745 L687,668"/>
  </g>

  <path d="M717,655 L812,655" stroke="#3a4250" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="820" y="643" font-weight="bold" fill="#1d2430">left and right,</text>
  <text x="820" y="659" font-weight="bold" fill="#1d2430">to the video</text>
  <text x="820" y="675" font-weight="bold" fill="#1d2430">cable</text>
  <text x="730" y="725" fill="#55606e">The enable ($FF23 bit 3) is ignored;</text>
  <text x="730" y="741" fill="#55606e">the select lines only move the</text>
  <text x="730" y="757" fill="#55606e">joystick.</text>
</svg>
